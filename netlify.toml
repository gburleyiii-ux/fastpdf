[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Disable secrets scanning - NEXT_PUBLIC_* vars are public by design
  SECRETS_SCAN_ENABLED = "false"

# Redirect all requests to Next.js
[[redirects]]
  from = "/*"
  to = "/"
  status = 200

# Redirect all requests to Next.js
[[redirects]]
  from = "/*"
  to = "/"
  status = 200
